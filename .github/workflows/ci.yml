name: CI

# Minden ág minden pushjára: teszt, típusellenőrzés, build, katalógus-ellenőrzés. (Pull request külön nem
# indítja, mert az ág pushja már lefuttatta.) Kiadás (Netlify, karakterek) nincs itt; azok tagre futnak.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Karakter-katalógus ellenőrzése
        run: node tools/upload_characters.mjs --dry-run
