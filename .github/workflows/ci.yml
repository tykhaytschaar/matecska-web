name: CI

# Minden pushra és pull requestre: teszt, típusellenőrzés, build, katalógus-ellenőrzés.
# Kiadás (Pages, karakterek) nincs itt; azok tagre futnak (release.yml, characters.yml).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Karakter-katalógus ellenőrzése
        run: node tools/upload_characters.mjs --dry-run
