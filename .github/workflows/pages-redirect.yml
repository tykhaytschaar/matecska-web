name: Pages átirányítás (egyszeri)

# A régi tykhaytschaar.github.io/matecska-web cím a matecska.apasupa.com-ra irányít. Kézzel indítandó,
# egyszer, a Netlify-kiadás után; a régi telepített PWA-k service workere leiratkozik, és a lap átirányít.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/redirect
      - id: deployment
        uses: actions/deploy-pages@v5
