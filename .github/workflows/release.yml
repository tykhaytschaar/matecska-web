name: Release (Netlify)

# Az app kiadása a matecska.apasupa.com címre: csak v* tagre (pl. v0.2.4). A tag száma egyezzen a
# web/package.json verziójával. A main-re push önmagában nem deployol. Kézi indítás (workflow_dispatch)
# csak vázlat-deployt készít egy előnézeti URL-re, élesbe nem megy.
# Titkok: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID; változók: SUPABASE_URL, SUPABASE_KEY.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: A tag a main ágon legyen, és egyezzen a package.json verziójával
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A tag ($GITHUB_REF_NAME) nem a main ág commitjára mutat, nincs kiadás." >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "A tag (v$tag) nem egyezik a package.json verziójával ($pkg)." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          # Supabase projekt (Settings → Secrets and variables → Actions → Variables). Nyilvános értékek.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - name: Deploy a Netlify-ra (tagre éles, kézi indításnál vázlat)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            npx --yes netlify-cli@latest deploy --prod --dir=dist --message "$GITHUB_REF_NAME" --no-build
          else
            npx --yes netlify-cli@latest deploy --dir=dist --message "vázlat $GITHUB_SHA" --no-build --alias "draft-$GITHUB_RUN_NUMBER" | tee deploy.log
            echo "Előnézet: $(grep -o 'https://[^ ]*netlify.app' deploy.log | head -1)" >> "$GITHUB_STEP_SUMMARY"
          fi
